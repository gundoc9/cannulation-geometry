<body>
<main id="app"></main>

<script>
const ERRS=[];
function repErr(m){ ERRS.push(String(m).slice(0,220));
  let p=document.getElementById('errpill');
  if(!p){ p=document.createElement('button'); p.id='errpill'; p.type='button';
    p.style.cssText='position:fixed;left:12px;bottom:12px;z-index:99;background:#B4472E;color:#EFE9DC;'+
      'border:0;border-radius:12px;padding:8px 12px;font:12px ui-monospace,monospace;max-width:88vw;text-align:left;';
    p.addEventListener('click',()=>{ p.textContent=ERRS.join('\n'); p.style.whiteSpace='pre-wrap'; });
    document.body.appendChild(p); }
  p.textContent='script errors: '+ERRS.length+' (tap for detail)';
}
window.addEventListener('error',e=>{
  // masked cross-origin noise carries no location and no stack; nothing to act on, stay silent
  const masked=(!e.message||/^Script error\.?$/.test(e.message))&&!(e.error&&e.error.stack);
  if(masked) return;
  repErr((e.message||'?')+' @'+(e.lineno||'?')+':'+(e.colno||'?'));
});
window.addEventListener('unhandledrejection',e=>{
  if(e.reason==null) return;
  repErr('promise: '+(e.reason&&e.reason.message||e.reason));
});
const CARDS = __CARDS__;
const AUTHOR="Dr Ganesh Sivasankara", CRED="MD \u00b7 FRCA \u00b7 FCARCSI \u00b7 Consultant Anaesthetist";
const VERSION="v27", BUILT="16 November 2026";

/* ================= geometry ================= */
const rad=d=>d*Math.PI/180, sin=d=>Math.sin(rad(d)), cos=d=>Math.cos(rad(d)), tan=d=>Math.tan(rad(d));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const G={
  LEN:[19,25,32,45],
  DEV:[{L:19,g:"24G",od:0.7,flow:22},{L:25,g:"22G",od:0.9,flow:35},
       {L:32,g:"24G",od:0.7,flow:17},{L:45,g:"22G",od:0.9,flow:26}],
  path:(d,t)=>d/sin(t),
  reach:(L,t)=>0.35*L*sin(t),
  inVein:(L,d,t)=>Math.max(0,L-d/sin(t)),
};

/* ================= palette ================= */
const F0=[13,24,27],F1=[26,44,49],LL=[230,239,237],MU=[126,144,147],
      AC=[245,198,75],VF=[10,16,20],PR=[150,162,164],
      OKC=[126,204,157],NOC=[226,124,108],
      TEAL=[[46,78,84],[58,98,106],[71,120,127]],
      H24=[242,194,75],H22=[110,168,224],
      GRIP=[118,130,133],RAIL=[104,120,123],PROBEINK=[60,70,72],
      CLEARB=[214,226,228],GREYG=[160,172,178],HILITE=[255,255,255],
      SCRN=[8,13,16],WFRM=[90,104,107];
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
const MONO=s=>s+"px 'GM',monospace", DISP=s=>"700 "+s+"px 'BS',sans-serif";

/* ================= field (gradient + grain), cached per size ============= */
function hash(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
const fcache={};
function fieldImg(w,h){
  const k=w+'x'+h; if(fcache[k])return fcache[k];
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const c2=cv.getContext('2d'), img=c2.createImageData(w,h), d=img.data;
  for(let y=0;y<h;y++){
    const g=y/h, vign=1-0.10*g*g;
    const r=(F0[0]*(1-g)+F1[0]*g)*vign, gg=(F0[1]*(1-g)+F1[1]*g)*vign, b=(F0[2]*(1-g)+F1[2]*g)*vign;
    for(let x=0;x<w;x++){
      const o=(y*w+x)*4, n=(hash(y*w+x)-0.5)*7;
      d[o]=r+n; d[o+1]=gg+n; d[o+2]=b+n; d[o+3]=255;
    }
  }
  c2.putImageData(img,0,0); fcache[k]=cv; return cv;
}

/* ================= draw helpers ================= */
function rl(ctx,x0,y0,x1,y1,col,w,a=1,cap=true){
  ctx.strokeStyle=rgba(col,a); ctx.lineWidth=w; ctx.lineCap=cap?'round':'butt';
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
}
function glowline(ctx,x0,y0,x1,y1,col,w){
  ctx.save(); ctx.shadowColor=rgba(col,0.55); ctx.shadowBlur=10;
  rl(ctx,x0,y0,x1,y1,col,w,0.92,false); ctx.restore();
}
function arcp(ctx,cx,cy,r,a0,a1,col,w,a=1){
  if(!(r>0)) return;
  ctx.strokeStyle=rgba(col,a); ctx.lineWidth=w; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(cx,cy,r,rad(a0),rad(a1)); ctx.stroke();
}
function handle(ctx,x,y,r=11){
  if(!(r>0)) return;
  ctx.save(); ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=8; ctx.shadowOffsetY=2;
  ctx.fillStyle=rgba(AC,1); ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); ctx.restore();
  ctx.strokeStyle=rgba(F0,1); ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.stroke();
  ctx.fillStyle=rgba(F0,1); ctx.beginPath(); ctx.arc(x,y,3.2,0,7); ctx.fill();
}
function cannula(ctx,x,y,ang,h,col,alpha=1){
  /* Real-device anatomy, per the user's photos: the gauge colour is the FRONT
     CONE tapering into the catheter; behind it a clear flashback chamber, then
     the wider vented plug with grip ridges. The wings are at the junction.
     (x,y) is where the catheter leaves the cone; the glyph extends back. */
  if(!(h>5)){ rl(ctx,x-6*cos(ang),y-6*sin(ang),x,y,col,Math.max(3,h*0.9),alpha); return; }
  ctx.save(); ctx.translate(x,y); ctx.rotate(rad(ang)); ctx.globalAlpha=alpha;
  const C=1.1*h, B=1.5*h, P=0.45*h;
  ctx.fillStyle=rgba(col,1);
  ctx.beginPath();
  ctx.moveTo(0,-0.20*h); ctx.lineTo(-C,-0.50*h); ctx.lineTo(-C,0.50*h); ctx.lineTo(0,0.20*h);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle=rgba(HILITE,0.20);
  ctx.beginPath();
  ctx.moveTo(-0.06*h,-0.16*h); ctx.lineTo(-C+0.10*h,-0.40*h); ctx.lineTo(-C+0.10*h,-0.12*h);
  ctx.lineTo(-0.06*h,-0.02*h); ctx.closePath(); ctx.fill();
  ctx.fillStyle=rgba(col,1);
  ctx.beginPath(); ctx.roundRect(-C-0.10*h,-0.86*h,0.42*h,0.34*h,0.08*h); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-C-0.10*h, 0.52*h,0.42*h,0.34*h,0.08*h); ctx.fill();
  ctx.fillStyle=rgba(CLEARB,0.28);
  ctx.strokeStyle=rgba(LL,0.60); ctx.lineWidth=Math.max(1,0.06*h);
  ctx.beginPath(); ctx.roundRect(-C-B,-0.44*h,B,0.88*h,0.16*h); ctx.fill(); ctx.stroke();
  ctx.fillStyle=rgba(CLEARB,0.42);
  ctx.beginPath(); ctx.roundRect(-C-B-P,-0.55*h,P,1.10*h,0.14*h); ctx.fill(); ctx.stroke();
  for(let k=1;k<=3;k++){ const rx=-C-B-P*k/4;
    rl(ctx,rx,-0.42*h,rx,0.42*h,LL,Math.max(1,0.05*h),0.45); }
  ctx.globalAlpha=1; ctx.restore();
}
function lsText(ctx,s,x,y,font,col,a=1,anchor="l",ls=1.4){
  ctx.font=font; ctx.fillStyle=rgba(col,a); ctx.textBaseline='alphabetic';
  let tot=0; for(const ch of s) tot+=ctx.measureText(ch).width+ls;
  tot-=ls;
  let cx = anchor==="r" ? x-tot : anchor==="m" ? x-tot/2 : x;
  for(const ch of s){ ctx.fillText(ch,cx,y); cx+=ctx.measureText(ch).width+ls; }
}
function txt(ctx,s,x,y,font,col,a=1,align="left",base="alphabetic"){
  ctx.font=font; ctx.fillStyle=rgba(col,a); ctx.textAlign=align; ctx.textBaseline=base;
  ctx.fillText(s,x,y); ctx.textAlign="left"; ctx.textBaseline="alphabetic";
}
/* a label that may sit across a faint line: a thin rim of field colour keeps it legible */
function htxt(ctx,s,x,y,font,col,a=1,align="left",base="alphabetic"){
  ctx.save(); ctx.font=font; ctx.textAlign=align; ctx.textBaseline=base;
  ctx.lineWidth=4; ctx.lineJoin="round"; ctx.strokeStyle=rgba(F0,0.92); ctx.strokeText(s,x,y);
  ctx.restore(); txt(ctx,s,x,y,font,col,a,align,base);
}
function scaleRight(ctx,W,H,x,y0,S,maxMm){
  rl(ctx,x,y0,x,H-46,MU,1,0.45,false);             // from the skin down: above it the line only crossed the SKIN label
  for(let mm=0;mm<=maxMm;mm++){
    const y=y0+mm*S; if(y>H-46)break;
    const maj=mm%5===0;
    rl(ctx,x,y,x+(maj?10:6),y,MU,1.5,maj?0.9:0.5,false);
    if(maj&&mm>0) txt(ctx,String(mm),x-7,y+3.5,MONO(12),MU,0.9,"right");
  }
}
let HINTX=null;                                     // left edge of this frame's pill, if any
function readout(ctx,H,label,big,unit){
  if(!big) return;
  lsText(ctx,label,20,H-52,MONO(10),MU,0.95,"l",1.5);
  let fs=34; ctx.font=DISP(fs); const w0=ctx.measureText(big).width;
  ctx.font=MONO(12); const uw=unit?ctx.measureText(unit).width+5:0;
  if(HINTX!==null){ const room=HINTX-12-20-uw; if(w0>room&&room>0) fs=Math.max(22,34*room/w0); }
  txt(ctx,big,20,H-14,DISP(fs),AC);
  const bw=ctx.measureText(big).width;
  txt(ctx,unit,25+bw,H-15,MONO(12),MU,0.9);
}
function hint(ctx,W,H,s){
  ctx.font=MONO(10);
  const w=ctx.measureText(s).width*1.12+26, x=W-14-w, y=H-36;
  ctx.fillStyle=rgba(F1,0.85); ctx.strokeStyle=rgba(MU,0.4); ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(x,y,w,22,11); ctx.fill(); ctx.stroke();
  lsText(ctx,s,x+13,y+15,MONO(10),AC,1,"l",0.8);
  HINTX=x;
  return x;
}
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath();};
}

/* ================= the pictures =================
   Each: (ctx,W,H,card,st,small) -> aria string.
   st holds continuous values; drag(card,st,x,y,W,H) maps a pointer to state. */

/* A vein that is pressed flat keeps its wall and loses its blood: the same perimeter, a smaller
   area. Half-width of the ellipse with half-height ry and the perimeter of a circle of radius r
   (Ramanujan's formula, solved by bisection; round at ry = r, pi r / 2 when fully flat). */
function flatRx(r,ry){
  const P=2*Math.PI*r, per=(a,b)=>Math.PI*(3*(a+b)-Math.sqrt((3*a+b)*(a+3*b)));
  let lo=r, hi=2*r;
  for(let i=0;i<30;i++){ const m=(lo+hi)/2; if(per(m,ry)<P) lo=m; else hi=m; }
  return (lo+hi)/2;
}
function picDepth(ctx,W,H,c,st,small){
  const OD=3,D0=5,cc=clamp(st.press??0,0,1),t=st.targ??0;
  const ry=(OD/2)*(1-0.55*cc), rx=flatRx(OD/2,ry), read=D0*(1-0.30*cc);
  const top=small?4:16;
  let S=(H-top-(small?6:46))/(D0+OD+1.2);
  if(!small) S=Math.min(S,(H-120)/(D0+OD));          // on a short screen the vein must still clear the readout
  const backY=top+(small?10:34)+(D0+OD)*S, face=backY-(read+2*ry)*S, cx=W*0.47;
  ctx.drawImage(fieldImg(W,H),0,0);
  if(!small){                                     // tissue between skin and vein: it thins as you press
    const fwy=backY-2*ry*S;
    for(const f of [0.3,0.7]){
      const y=face+(fwy-face)*f;
      ctx.strokeStyle=rgba(LL,0.15); ctx.lineWidth=1.1; ctx.beginPath();
      for(let x=0;x<=W-46;x+=6){ const yy=y+1.5*Math.sin(x*0.045+f*9); x===0?ctx.moveTo(x,yy):ctx.lineTo(x,yy); }
      ctx.stroke();
    }
  }
  ctx.fillStyle=rgba(VF,1);
  ctx.beginPath(); ctx.ellipse(cx,backY-ry*S,rx*S,ry*S,0,0,7); ctx.fill();
  ctx.strokeStyle=rgba(LL,0.9); ctx.lineWidth=small?1.2:1.9; ctx.stroke();
  /* The probe is a head of fixed height that travels down with its face. The body above it
     runs up out of the picture and is drawn light, so a firm press does not fill the window. */
  const px0=small?4:20, pw=W-(small?8:40), hd=small?10:34, pr=small?4:10, ht=face-hd;
  { const y1=ht+pr, gl=Math.max(60,y1);
    const gb=ctx.createLinearGradient(0,0,0,gl); gb.addColorStop(0,rgba(PR,0.10)); gb.addColorStop(1,rgba(PR,0.24));
    ctx.fillStyle=gb; ctx.fillRect(px0,0,pw,y1);
    const gs=ctx.createLinearGradient(0,0,0,gl); gs.addColorStop(0,rgba(PR,0.10)); gs.addColorStop(1,rgba(PR,0.55));
    ctx.strokeStyle=gs; ctx.lineWidth=1.1; ctx.lineCap='butt';
    ctx.beginPath(); ctx.moveTo(px0+0.55,0); ctx.lineTo(px0+0.55,y1); ctx.moveTo(px0+pw-0.55,0); ctx.lineTo(px0+pw-0.55,y1); ctx.stroke(); }
  ctx.fillStyle=rgba(PR,1);
  ctx.beginPath(); ctx.roundRect(px0,ht,pw,hd,pr); ctx.fill();
  ctx.fillStyle=rgba(GRIP,1);
  ctx.beginPath(); ctx.roundRect(px0,ht,pw,small?3:9,small?2:5); ctx.fill();
  if(!small){
    for(const gx of [-12,0,12]) rl(ctx,cx+gx,ht+18,cx+gx,face-14,GRIP,2.2,0.85);
    lsText(ctx,"PROBE",34,(ht+face)/2+4,MONO(10),PROBEINK,1,"l",1.6);
    const hx=W-44,hy=(ht+face)/2;
    ctx.fillStyle=rgba(AC,1); ctx.beginPath(); ctx.roundRect(hx-9,hy-16,18,32,9); ctx.fill();
    ctx.fillStyle=rgba(F0,1);
    ctx.beginPath(); ctx.moveTo(hx-4,hy-5); ctx.lineTo(hx+4,hy-5); ctx.lineTo(hx,hy-10); ctx.fill();
    ctx.beginPath(); ctx.moveTo(hx-4,hy+5); ctx.lineTo(hx+4,hy+5); ctx.lineTo(hx,hy+10); ctx.fill();
  }
  glowline(ctx,0,face,W-(small?0:46),face,LL,small?1.4:2.4);
  if(small) return "";
  lsText(ctx,"SKIN",34,face+18,MONO(10),MU,0.9,"l",1.5);
  scaleRight(ctx,W,H,W-28,face,S,9);
  const fw=backY-2*ry*S, cyv=backY-ry*S, ty=fw+(cyv-fw)*t, val=(ty-face)/S;
  rl(ctx,cx,face,cx,ty,AC,1.7,0.6);
  for(const y of [face,ty]) rl(ctx,cx-6,y,cx+6,y,AC,2.6);
  htxt(ctx,val.toFixed(1)+" mm",cx+13,(face+ty)/2+4,MONO(12),AC);
  hint(ctx,W,H,"DRAG THE PROBE");
  readout(ctx,H,"DEPTH FROM PROBE FACE",val.toFixed(1),"mm");
  return `Depth reads ${val.toFixed(1)} millimetres. The vein is fixed; the probe has moved.`;
}
picDepth.drag=(c,st,x,y,W,H)=>{ st.press=clamp((y-70)/(H*0.34),0,1); };

function angGeom(st,W,H,small){
  const ang=clamp(st.angle??45,20,60), D=5, VB=3;           // VB: the vein, 3 mm across as elsewhere
  let skin=small?10:48;
  const Sv=small?7:(H-130)/(D+VB);                          // the back wall must clear the readout
  const S=Math.min(Sv,(W-(small?24:104))/(D/tan(ang)));   // shrink the triangle, keep the shape
  if(!small) skin=Math.min(48+Math.max(0,(Sv-S))*(D+VB)/2, H-82-(D+VB)*S);   // centre when width-bound
  const punc=small?10:52;
  return {ang,D,VB,skin,S,punc,vt:skin+D*S,tipx:punc+D/tan(ang)*S};
}
function picAngleTri(ctx,W,H,c,st,small){
  const {ang,D,VB,skin,S,punc}=angGeom(st,W,H,small);
  ctx.drawImage(fieldImg(W,H),0,0);
  const vt=skin+D*S, vb=small?H:vt+VB*S;
  ctx.fillStyle=rgba(VF,1); ctx.fillRect(0,vt,W,vb-vt);
  rl(ctx,0,vt,W,vt,LL,small?1.2:1.8,0.85,false);
  if(!small) rl(ctx,0,vb,W,vb,LL,1.6,0.55,false);
  glowline(ctx,0,skin,W,skin,LL,small?1.4:2.2);
  const tipx=punc+D/tan(ang)*S;
  if(!small){
    lsText(ctx,"SKIN",W-16,skin-12,MONO(10),MU,0.9,"r",1.5);
    lsText(ctx,"VEIN",20,vt+16,MONO(10),MU,0.9,"l",1.5);
    rl(ctx,punc,skin,punc,vt,MU,1.5,0.75);
    ctx.strokeStyle=rgba(MU,0.65); ctx.lineWidth=1.3;
    ctx.strokeRect(punc,vt-8,8,8);
    txt(ctx,D.toFixed(1)+" mm",punc+11,skin+(vt-skin)*clamp(0.5+(ang-45)/15*0.28,0.5,0.78)+4,MONO(12),LL,0.95);
    arcp(ctx,punc,skin,34,0,ang,MU,1.8,0.85);
    const bx=punc+64*cos(ang/2), by2=skin+Math.max(11,64*sin(ang/2));   // 11, not 14: at 20 degrees the label was on the needle
    txt(ctx,Math.round(ang)+"\u00b0",bx,by2+5,MONO(14),AC);
    const RAD=Math.hypot(tipx-punc,vt-skin);
    arcp(ctx,punc,skin,RAD,clamp(ang-14,16,90),clamp(ang+2,16,90),RAIL,2.2,0.9);
  }
  ctx.save(); ctx.shadowColor=rgba(AC,0.5); ctx.shadowBlur=10;
  rl(ctx,punc,skin,tipx,vt,AC,small?2.5:5.2); ctx.restore();
  if(small) return "";
  const nx=cos(ang+90),ny=sin(ang+90);
  for(const [bx,by] of [[punc,skin],[tipx,vt]])
    rl(ctx,bx-nx*5,by-ny*5,bx+nx*5,by+ny*5,AC,2.4);
  const mid=[(punc+tipx)/2,(skin+vt)/2];
  txt(ctx,(D/sin(ang)).toFixed(1)+" mm",mid[0]+11,mid[1]-9,MONO(12),AC);
  handle(ctx,tipx,vt,12);
  hint(ctx,W,H,"DRAG THE TIP");
  readout(ctx,H,"PATH \u00f7 DEPTH",(1/sin(ang)).toFixed(1)+"\u00d7","");
  return `Entry angle ${Math.round(ang)} degrees. The path is ${(1/sin(ang)).toFixed(1)} times the depth.`;
}
picAngleTri.drag=(c,st,x,y,W,H)=>{
  const g0=angGeom(st,W,H,false);           // pivot from the current frame
  st.angle=clamp(Math.atan2(y-g0.skin,x-g0.punc)/Math.PI*180,20,60);
};

const SMAX=11.76;                                    // the largest scale the track drawing has ever been given
function trackGeom(c,st,W,H,small){
  const L=c.fixL||G.LEN[st.len??2], ang=clamp(st.angle??45,20,60), D=5, dv=1.5;
  const wfit=(l,a)=>(W-(small?18:58))/(6.5*cos(a)+(l-D*tan(a/2)));   // hub projection + catheter run
  let S=wfit(L,ang), skin=H*0.30, bar=null;
  if(!small){
    /* Top to bottom the window holds the hub's rise above the skin, the drawing down to its
       bracket, the same catheter laid straight on a ruler, and the readout. The drawing takes
       what the others leave and is never larger than it was before the ruler. The skin line is
       set from the steepest angle the card can reach, so it holds still while the angle is
       dragged; spare height goes mostly above the drawing, to keep it near its ruler. */
    const lenCard=(c.ctrl||[]).some(k=>k.key==="len"), turn=(c.ctrl||[]).some(k=>k.key==="angle");
    const Lmax=lenCard?G.LEN[G.LEN.length-1]:L, aTop=turn?60:ang;
    const kk=3.05*sin(aTop)+0.55*cos(aTop), k0=8+0.6*sin(aTop), rise=s=>0.6*s*sin(aTop)+Math.min(2.05*s,22)*kk;
    const solve=A=>{ const s=A/(k0+2.05*kk); return s<=22/2.05?s:(A-22*kk)/k0; };   // rise(s)+8s = A
    let yB=H-(c.numeral?80:16), Sh=solve(yB-144);
    if(Sh>=4.5){ const SB=Math.min((W-42)/(6.5+Lmax),SMAX);
      bar={SB,Lmax,yB,xt:14+(6.5+Lmax)*SB,bh:Math.min(13,1.5*SB)}; }
    else Sh=Math.max(3,solve(H-(c.numeral?62:8)-75));      // too short for the ruler: the drawing alone
    const Sref=Math.min(Sh,SMAX,wfit(L,aTop));
    const need=10+rise(Sref)+8*Sref+55+(bar?79+(H-yB):(c.numeral?72:18));
    skin=10+rise(Sref)+0.62*Math.max(0,H-need);
    S=Math.min(S,Sh,SMAX);
  }
  const lin=G.inVein(L,D,ang), len2=dv/sin(ang), len3=lin-len2;
  const punc=(small?4:14)+6.5*cos(ang)*S;
  const wallT=skin+D*S, wallB=wallT+3*S, ride=wallT+dv*S;
  const ex=punc+D/tan(ang)*S, ix=ex+dv/tan(ang)*S, tip=ix+len3*S;
  return {L,ang,D,dv,S,lin,len2,len3,skin,punc,wallT,wallB,ride,ex,ix,tip,bar};
}
/* The same catheter laid straight along a ruler that counts back from its tip, with the vein
   drawn from the point where the catheter enters it. A mark is met when it lies inside the
   vein. The ruler keeps one scale for the card, so a mark a fixed length from the tip stays
   where it is when the catheter changes. */
function straight(ctx,W,c,g,o){
  const b=g.bar; if(!b) return;
  const {L,ang,D,lin}=g, {SB,xt,bh,yB,Lmax}=b;
  const X=mm=>xt-mm*SB, yc=yB-26-bh, xe=X(lin), xh=X(L);
  ctx.fillStyle=rgba(VF,1); ctx.fillRect(xe,yc-bh,W-xe,2*bh);                  // the vein, from its front wall on
  rl(ctx,xe,yc-bh,W,yc-bh,LL,1.4,0.5,false);
  rl(ctx,xe,yc+bh,W,yc+bh,LL,1.4,0.34,false);
  rl(ctx,xe,yc-bh-0.7,xe,yc+bh+0.7,LL,2,0.9,false);                            // the front wall: a mark to its right is inside
  const yr=yB-19, ax=o.hasAbs?X(27.5):null;                                    // the ruler
  rl(ctx,X(Lmax),yr,xt,yr,MU,1.4,0.6,false);
  for(let mm=0;mm<=Lmax;mm+=5){
    const maj=mm%10===0, x=X(mm);
    rl(ctx,x,yr,x,yr+(maj?8:5),MU,1.4,maj?0.85:0.5,false);
    if(!maj||(ax!==null&&mm===30)) continue;                                   // the 27.5 mark takes the place of the 30 beside it
    if(mm) txt(ctx,String(mm),x,yB,MONO(10),MU,0.85,"center"); else lsText(ctx,"TIP",x,yB,MONO(10),MU,0.9,"m",1.4);
  }
  lsText(ctx,"mm",X(Lmax)-9,yB,MONO(10),MU,0.8,"r",1.0);
  cannula(ctx,xh,yc,0,6.5*SB/3.05,o.hcol,0.62);                                 // the catheter: dim outside the vein, lit inside
  rl(ctx,xh,yc,xe,yc,LL,4.5,0.5,false);
  ctx.save(); ctx.shadowColor=rgba(LL,0.4); ctx.shadowBlur=8; rl(ctx,xe,yc,xt,yc,o.hl?AC:LL,4.5); ctx.restore();
  const tick=(mm,col)=>{ const x=X(mm), r=mm>L?0.86*6.5*SB/3.05+5:9;             // taller where it has to cross the hub
    if(mm>L) rl(ctx,x,yc-r-1,x,yc+r+1,F0,6,0.9); rl(ctx,x,yc-r,x,yc+r,col,3); return x; };
  if(o.has65){
    const col=o.ok65?OKC:NOC, x=tick(0.65*L,col), s=`65% = ${(Math.round(0.65*L*10+1e-9)/10).toFixed(1)} mm`;
    ctx.font=MONO(12); const w=ctx.measureText(s).width;
    txt(ctx,s,clamp(x,14+w/2,W-14-w/2),yc-bh-7,MONO(12),col,1,"center");
  }
  if(o.hasAbs){
    const col=o.okAbs?OKC:NOC, x=tick(27.5,col);
    rl(ctx,x,yc+10,x,yB-11,col,1.2,0.55,false);
    htxt(ctx,"27.5",x,yB,MONO(12),col,1,"center");
  }
}
function picTrack(ctx,W,H,c,st,small){
  const g=trackGeom(c,st,W,H,small);
  const {L,ang,S,lin,len2,len3,skin,punc,wallT,wallB,ride,ex,ix,tip}=g;
  ctx.drawImage(fieldImg(W,H),0,0);
  ctx.fillStyle=rgba(VF,1); ctx.fillRect(0,wallT,W,wallB-wallT);
  rl(ctx,0,wallT,W,wallT,LL,small?1.2:1.8,0.85,false);
  rl(ctx,0,wallB,W,wallB,LL,small?1:1.6,0.55,false);
  glowline(ctx,0,skin,W,skin,LL,small?1.4:2.2);
  const hl=(c.marks||[]).includes("lumen"), inCol=hl?AC:LL;
  const dev=G.DEV.find(d=>d.L===L)||G.DEV[2], hcol=dev.g==="24G"?H24:H22;
  if(c.fan&&!small) for(const o of (c.ctrl[0].opts)){         // each reading of the same hand
    const ga=o[0]; if(Math.abs(ga-ang)<0.5) continue;
    const gex=punc+g.D/tan(ga)*S, gix=gex+g.dv/tan(ga)*S;
    rl(ctx,punc,skin,gex,wallT,LL,2.2,0.24); rl(ctx,gex,wallT,gix,ride,LL,2.2,0.24);
  }
  cannula(ctx,punc-0.6*S*cos(ang),skin-0.6*S*sin(ang),ang,
          small?Math.min(2.05*S,7):Math.min(2.05*S,22),hcol);
  ctx.save(); ctx.shadowColor=rgba(LL,0.4); ctx.shadowBlur=8;
  rl(ctx,punc,skin,ex,wallT,LL,small?2.6:4.5); ctx.restore();
  rl(ctx,ex,wallT,ix,ride,inCol,small?2.6:4.5);
  rl(ctx,ix,ride,tip,ride,inCol,small?2.6:4.5);
  if(small) return "";
  lsText(ctx,"SKIN",W-16,skin-12,MONO(10),MU,0.9,"r",1.5);
  lsText(ctx,"VEIN",20,wallT+Math.min(15,1.5*S+4.5),MONO(10),MU,0.9,"l",1.5);   // centred when the band is thin
  lsText(ctx,"TIP",Math.min(tip,W-64),wallB+16,MONO(10),MU,0.9,"m",1.4);
  const at=mm=>{
    if(mm<=len3) return [tip-mm*S,ride,0];
    if(mm<=lin){ const t=mm-len3; return [ix-t*cos(ang)*S,ride-t*sin(ang)*S,ang]; }
    const t=mm-lin; return [ex-t*cos(ang)*S,wallT-t*sin(ang)*S,ang];
  };
  const mark=(mm,lab,above)=>{
    const ok=mm<=lin, col=ok?OKC:NOC, [x,y,a0]=at(mm);
    const nx=cos(a0+90),ny=sin(a0+90);
    rl(ctx,x-nx*9,y-ny*9,x+nx*9,y+ny*9,col,3);
    if(above){ let lx=x, ly=y-16, al="center";
      if(a0>0){ lx=x-nx*9+6; ly=y-ny*9-2; al="left"; }        // on the slope: beside the tick, clear of the shaft
      if(ly>wallT-5&&ly-11<wallT+3) ly=wallT-5;               // and never across the front wall
      htxt(ctx,lab,lx,ly,MONO(12),col,1,al); }
    else{ const ly=wallB+20; rl(ctx,x,y+10,x,ly-9,col,1.2,0.55,false);
      htxt(ctx,lab,Math.min(Math.max(x,26),W-44),ly,MONO(12),col,1,"center","middle"); }
    return ok;
  };
  let note=[], vy=wallB+36;
  if(!small){
    rl(ctx,ex,vy,tip,vy,MU,1.4,0.65,false);
    for(const bx of [ex,tip]) rl(ctx,bx,vy-5,bx,vy,MU,1.4,0.65,false);
    txt(ctx,lin.toFixed(1)+" mm in the vein",(ex+tip)/2,vy+15,MONO(12),MU,0.85,"center");
  }
  const has65=(c.marks||[]).includes("m65"), hasAbs=(c.marks||[]).includes("abs");
  let ok65=null, okAbs=null;
  if(has65){ ok65=mark(0.65*L,"65%",true); note.push(ok65?"rule met":"rule not met"); }
  if(hasAbs){
    if(27.5>L) note.push("shorter than 27.5 mm");      // the mark would lie beyond the hub: the ruler shows it there
    else{ okAbs=mark(27.5,"27.5",false); note.push(okAbs?"27.5 mm inside":"27.5 mm not inside"); }
  }
  straight(ctx,W,c,g,{has65,hasAbs,ok65,okAbs,hl,hcol});
  const sx=W-28;
  for(let mm=0;mm<=8;mm++){
    const y=skin+mm*S, maj=mm%5===0;
    if(y>wallT+3&&y<wallB-3&&mm!==5) continue;
    rl(ctx,sx,y,sx+(maj?10:6),y,MU,1.6,maj?0.9:0.5,false);
    if(maj&&mm>0) txt(ctx,String(mm),sx-7,y-5,MONO(12),MU,0.9,"right");   // above the wall line: the vein's front wall is drawn at this depth
  }
  const isLen=(c.ctrl||[]).some(k=>k.key==="len");
  if((c.ctrl||[]).length&&!isLen) hint(ctx,W,H,"DRAG THE ANGLE");
  const held=(c.tilt&&st.held!==undefined)?Math.round(st.held):null;
  const R=held!==null?["YOU HELD",held+"\u00b0",""]:(c.numeral?c.numeral(L,ang,lin):null);
  if(R&&R[1]) readout(ctx,H,R[0],R[1],R[2]);
  return `${L} millimetre catheter at ${Math.round(ang)} degrees, skin horizontal, vein beneath. ${lin.toFixed(1)} millimetres in the vein. ${note.join(", ")}${held!==null?`. You held ${held} degrees`:""}`;
}
picTrack.drag=(c,st,x,y,W,H)=>{
  if((c.ctrl||[]).some(k=>k.key==="len")) return;
  const g=trackGeom(c,st,W,H,false), b=g.bar;
  if(b&&y>b.yB-48-2*b.bh){                             // on the ruler, the finger holds the front wall
    const path=clamp(g.L-(b.xt-x)/b.SB,g.D/sin(60),g.D/sin(20));
    st.angle=clamp(Math.asin(g.D/path)/Math.PI*180,20,60); return;
  }
  const dx=Math.max(6,x-g.punc);
  st.angle=clamp(Math.atan((g.D*g.S)/dx)/Math.PI*180,20,60);
};

function picArc(ctx,W,H,c,st,small){
  const ang=clamp(st.angle??45,20,60), selL=G.LEN[st.len??3];
  const skin=small?8:46, punc=small?8:52;
  const S=(Math.min(W-(small?12:100),H-skin-(small?6:66)))/(0.35*45);
  ctx.drawImage(fieldImg(W,H),0,0);
  glowline(ctx,0,skin,W,skin,LL,small?1.4:2.2);
  if(!small){
    lsText(ctx,"SKIN",W-16,skin-12,MONO(10),MU,0.9,"r",1.5);
    if(c.wedge){
      ctx.fillStyle=rgba(AC,0.09); ctx.beginPath(); ctx.moveTo(punc,skin);
      ctx.arc(punc,skin,0.35*45*S,rad(20),rad(45)); ctx.closePath(); ctx.fill();
    }else{
      const vy=skin+6*S*0.35*45/ (0.35*45) * (6/ (0.35*45)); // vein at 6 mm
      const vyy=skin+6*S;
      rl(ctx,0,vyy,W-46,vyy,MU,1.5,0.55,false);
      lsText(ctx,"VEIN AT",16,vyy-23,MONO(10),MU,0.85,"l",1.2);      // two short lines: one long one ran into the 19 mm arc
      lsText(ctx,"6.0 mm",16,vyy-10,MONO(10),MU,0.85,"l",1.2);
    }
    ctx.fillStyle=rgba(LL,1); ctx.beginPath(); ctx.arc(punc,skin,3.6,0,7); ctx.fill();
  }
  G.LEN.forEach((L,i)=>{
    const on=L===selL, r=0.35*L*S;
    arcp(ctx,punc,skin,r,12,80,on?AC:TEAL[Math.min(i,2)],on?(small?2.4:3.8):(small?1.6:2.8),on?1:0.85);
    if(!small){
      const fx=punc+r*cos(80),fy=skin+r*sin(80);
      txt(ctx,String(L),fx-9,fy+4,MONO(12),on?AC:MU,0.95,"right");
    }
  });
  if(small) return "";
  scaleRight(ctx,W,H,W-28,skin,S,17);
  const r=0.35*selL*S, hx=punc+r*cos(ang), hy=skin+r*sin(ang);
  rl(ctx,punc,skin,hx,hy,AC,1.4,0.5);
  if(hx+13<W-60) rl(ctx,hx+13,hy,W-60,hy,AC,1.4,0.7,false);    // stops short of the scale's numbers
  rl(ctx,W-28,hy,W-15,hy,AC,2.4,1,false);                        // and the level is marked on the scale itself
  handle(ctx,hx,hy,10);
  hint(ctx,W,H,"DRAG ALONG THE ARC");
  if(c.wedge){
    const kept=100*sin(ang)/sin(45);
    readout(ctx,H,"OF THE 45\u00b0 REACH KEPT",kept.toFixed(1),"%");
    return `At ${Math.round(ang)} degrees, ${kept.toFixed(1)} per cent of the 45 degree reach remains, for every catheter.`;
  }
  readout(ctx,H,"MAX VEIN DEPTH SERVED",G.reach(selL,ang).toFixed(1),"mm");
  return `${selL} millimetre catheter at ${Math.round(ang)} degrees reaches ${G.reach(selL,ang).toFixed(1)} millimetres.`;
}
picArc.drag=(c,st,x,y,W,H)=>{ st.angle=clamp(Math.atan2(y-46,x-52)/Math.PI*180,20,60); };

function picDevices(ctx,W,H,c,st,small){
  const sel=st.len??2, S=(W-(small?14:70))/56.5, x0=small?6:26;
  ctx.drawImage(fieldImg(W,H),0,0);
  const fl=!!c.flow&&!small, gap=small?12:(fl?84:68); let KEYLOW=false;
  const gapFit=small?gap:Math.max(40,Math.min(gap,(H-173-(fl?50:40))/3));
  const rows=[...Array(4)].map((_,i)=>(small?8:60)+i*gapFit);
  /* The end-on dots: near 22 px to the millimetre at any width, by a whole factor that the
     picture states; fewer where the flow rows are close, so a dot clears the row above it. */
  const DOTX=Math.max(2,Math.min(Math.round(22/S),fl?Math.floor((gapFit-45)*2/(0.9*S)):99));
  const FMAX=Math.max(...G.DEV.map(d=>d.flow)), FS=36*S/FMAX;       // flow bars: the fastest spans 36 mm of width
  G.DEV.forEach((d,i)=>{
    const y=rows[i], on=i===sel, a=on?1:0.45, col=d.g==="24G"?H24:H22;
    cannula(ctx,x0+6.5*S,y,0,6.5*S/3.05,col,a);
    rl(ctx,x0+6.5*S,y,x0+(6.5+d.L)*S,y,LL,Math.max(small?2:3.4,d.od*S*0.9),a);
    if(!small){
      const ly=y-Math.max(16,0.86*6.5*S/3.05+6), lab=`${d.g} \u00b7 ${d.L} mm \u00b7 ${d.od} mm OD`;   // clear of the wings at any width
      lsText(ctx,lab,x0,ly,MONO(10),on?col:MU,on?1:0.8,"l",1.0);
      /* The catheter end-on, beside its label. Gauge is a width, and at the scale of the
         shafts 0.7 against 0.9 mm is a single pixel, so the end-on view is drawn DOTX times larger. */
      ctx.font=MONO(10); let lw=0; for(const ch of lab) lw+=ctx.measureText(ch).width+1.0;
      const dr=d.od*S*DOTX/2;
      ctx.fillStyle=rgba(col,a); ctx.beginPath(); ctx.arc(x0+lw+8+dr,ly-3.6,dr,0,7); ctx.fill();
      if(i===0){                                         // say once what the dots are, beside the first
        const note="END ON \u00b7 \u00d7"+DOTX, nx=x0+lw+8+2*dr+9; let nw=0; for(const ch of note) nw+=ctx.measureText(ch).width+1.0;
        if(nx+nw<=W-10) lsText(ctx,note,nx,ly,MONO(10),MU,0.8,"l",1.0);
        else if(!fl) KEYLOW=true;
      }
    }
    if(fl){
      const by=y+16, bx=x0+6.5*S, bl=d.flow*FS;
      ctx.fillStyle=rgba(on?AC:MU,on?0.9:0.42); ctx.beginPath(); ctx.roundRect(bx,by-3.5,bl,7,3.5); ctx.fill();
      txt(ctx,`${d.flow} mL/min`,bx+bl+8,by+4,MONO(10),on?AC:MU,on?1:0.8);
    }
  });
  if(small) return "";
  const ay=rows[3]+(fl?50:40);
  rl(ctx,x0+6.5*S,ay,x0+(6.5+50)*S,ay,MU,1.4,0.6,false);
  for(let mm=0;mm<=50;mm+=5){
    const xx=x0+(6.5+mm)*S, maj=mm%10===0;
    rl(ctx,xx,ay,xx,ay+(maj?8:5),MU,1.4,maj?0.85:0.5,false);
    if(maj) txt(ctx,String(mm),xx,ay+24,MONO(10),MU,0.85,"center");
  }
  lsText(ctx,"mm FROM THE HUB",x0+(6.5+46)*S,ay+42,MONO(10),MU,0.8,"r",1.0);
  if(KEYLOW){ ctx.fillStyle=rgba(MU,0.8); ctx.beginPath(); ctx.arc(x0+4,ay+38.4,4,0,7); ctx.fill();   // too narrow for the note beside the first dot
    lsText(ctx,"END ON \u00b7 \u00d7"+DOTX,x0+14,ay+42,MONO(10),MU,0.8,"l",1.0); }
  const d=G.DEV[sel];
  if(c.flow) readout(ctx,H,"MAX FLOW",String(d.flow),"mL/min");
  else readout(ctx,H,"LENGTH",String(d.L),"mm");
  return `${d.g}, ${d.L} millimetres, ${d.od} millimetre outer diameter, ${d.flow} millilitres per minute.`;
}

function picCross(ctx,W,H,c,st,small){
  const thr=(st.thr??45)/100, minv=0.9/thr;
  ctx.drawImage(fieldImg(W,H),0,0);
  const gx=W-152;                                        // the gauge column
  const S=small?12:Math.min(52,(gx-13-84)/(0.9/0.33));    // the largest vein must end clear of the dots
  const cx=small?W*0.5:(84+(0.9/0.33/2)*S), cy=small?H*0.5:H*0.40;
  const rV=minv/2*S, rC=0.45*S;
  ctx.fillStyle=rgba(VF,1); ctx.beginPath(); ctx.arc(cx,cy,rV,0,7); ctx.fill();
  ctx.strokeStyle=rgba(LL,0.9); ctx.lineWidth=small?1.2:2; ctx.stroke();
  const ccy=cy;
  ctx.fillStyle=rgba(H22,1); ctx.beginPath(); ctx.arc(cx,ccy,rC,0,7); ctx.fill();
  ctx.strokeStyle=rgba(F0,1); ctx.lineWidth=1.6; ctx.stroke();
  if(small) return "";
  if(rC>=12) txt(ctx,"22G",cx,ccy+4,MONO(10),F0,1,"center");      // only where the disc is wide enough to hold it
  const xd=cx-rV-18;
  rl(ctx,xd,cy-rV,xd,cy+rV,AC,1.6,0.8);
  for(const yy of [cy-rV,cy+rV]){
    rl(ctx,xd-6,yy,xd+6,yy,AC,2.6);
    rl(ctx,xd+8,yy,cx-rV+4,yy,MU,1.1,0.45,false);
  }
  txt(ctx,minv.toFixed(1)+" mm",xd-12,cy+4,MONO(12),AC,1,"right");
  lsText(ctx,`MIN VEIN \u00b7 \u2264${Math.round(thr*100)}%`,gx,54,MONO(10),MU,0.9,"l",1.2);
  [["24G",0.7,H24],["22G",0.9,H22],["20G",1.1,GREYG],["18G",1.3,GREYG]]
  .forEach(([g,od,col],i)=>{
    const y=86+i*50, r=od*11;
    ctx.fillStyle=rgba(col,1); ctx.beginPath(); ctx.arc(gx+9,y,r,0,7); ctx.fill();
    txt(ctx,g,gx+34,y+4,MONO(12),LL,0.95);
    txt(ctx,(Math.round(od/thr*10+1e-9)/10).toFixed(1),gx+86,y+4,MONO(12),LL);
  });
  ctx.font=MONO(10);                                     // caption under the vein, never past an edge
  const lw=s=>{ let w=0; for(const ch of s) w+=ctx.measureText(ch).width+1.1; return w-1.1; };
  const put=(s,y)=>{ const w=lw(s); lsText(ctx,s,clamp(cx,12+w/2,gx-16-w/2),y,MONO(10),MU,0.85,"m",1.1); };
  const cap="SMALLEST VEIN THAT PASSES", capY=cy+rV+22;
  if(lw(cap)<=gx-28) put(cap,capY); else { put("SMALLEST VEIN",capY); put("THAT PASSES",capY+14); }
  readout(ctx,H,"MIN VEIN FOR A 22G",minv.toFixed(1),"mm");
  return `Threshold ${Math.round(thr*100)} per cent. A 22G needs a ${minv.toFixed(1)} millimetre vein.`;
}

function picStages(ctx,W,H,c,st,small){
  /* Enter at 30, advance a millimetre or two inside the vein, then a PURE
     PIVOT about the puncture. The pivot is small because a pivot on half a
     millimetre of purchase would swing the tip straight back out. */
  const u=clamp(st.stage??0,0,2), D=5, ENT=30, dIn=0.30, dAdv=1.20;
  const s1=0.80*D/sin(ENT), s2=(D+dIn)/sin(ENT), s3=(D+dIn+dAdv)/sin(ENT);
  const A3=Math.asin((D+0.60)/s3)/Math.PI*180;
  let sh,A;
  if(u<=1){ sh=s1+(s2-s1)*u; A=ENT; }
  else if(u<=1.5){ sh=s2+(s3-s2)*(u-1)*2; A=ENT; }
  else { sh=s3; A=ENT+(A3-ENT)*(u-1.5)*2; }
  const d=sh*sin(A), run=sh*cos(A);
  let S=(W-(small?26:56))/(s3*cos(A3)+6.3*cos(A3)+0.8);
  if(!small) S=Math.min(S,(H-124)/8);                  // the band must clear the readout
  const skin=small?10:52, P=(small?6:16)+6.3*cos(A3)*S;
  const wallT=skin+D*S, wallB=wallT+3*S;
  const tx=P+run*S, ty=skin+d*S;
  ctx.drawImage(fieldImg(W,H),0,0);
  ctx.fillStyle=rgba(VF,1); ctx.fillRect(0,wallT,W,wallB-wallT);
  rl(ctx,0,wallT,W,wallT,LL,small?1.2:1.8,0.85,false);
  rl(ctx,0,wallB,W,wallB,LL,small?1:1.6,0.55,false);
  glowline(ctx,0,skin,W,skin,LL,small?1.4:2.2);
  if(!small){
    const my=wallT+1.5*S;                                   // the middle of the lumen
    ctx.save(); ctx.setLineDash([5,6]); rl(ctx,86,my,W,my,LL,1.3,0.42,false); ctx.restore();
    lsText(ctx,"MIDLINE",20,my+3.5,MONO(10),MU,0.75,"l",1.2);
    if(u>1){                                                // where the tip was at entry
      const gx=P+s2*cos(ENT)*S, gy=skin+s2*sin(ENT)*S;
      rl(ctx,P,skin,gx,gy,LL,3,0.26);
      ctx.fillStyle=rgba(LL,0.34); ctx.beginPath(); ctx.arc(gx,gy,3.2,0,7); ctx.fill();
    }
  }
  cannula(ctx,P-0.6*S*cos(A),skin-0.6*S*sin(A),A,small?7:Math.min(2.05*S,22),H24);
  ctx.save(); ctx.shadowColor=rgba(LL,0.4); ctx.shadowBlur=8;
  rl(ctx,P,skin,tx,ty,LL,small?2.6:4.5); ctx.restore();
  ctx.fillStyle=rgba(AC,1); ctx.beginPath(); ctx.arc(tx,ty,small?2.4:3.8,0,7); ctx.fill();
  if(small) return "";
  lsText(ctx,"SKIN",W-16,skin-12,MONO(10),MU,0.9,"r",1.5);
  lsText(ctx,"VEIN",20,wallT+15,MONO(10),MU,0.9,"l",1.5);
  hint(ctx,W,H,"DRAG ACROSS");
  readout(ctx,H,"SHAFT ANGLE",String(Math.round(A))+"\u00b0","");
  const names=["approaching the vein","just through the wall","a small advance, then the drop"];
  return `Stage ${Math.round(u)+1} of 3, ${names[Math.round(u)]}. Shaft at ${Math.round(A)} degrees, tip ${d.toFixed(1)} millimetres deep.`;
}
picStages.drag=(c,st,x,y,W,H)=>{
  /* The manoeuvre is a few millimetres of tip travel, too little to follow with a finger,
     so the whole width of the drawing is the whole manoeuvre: left edge at the skin,
     right edge flattened, the advance and the pivot each given a quarter. */
  st.stage=clamp((x-24)/(W-48)*2,0,2);
};
function planesGeom(W,H,small){
  const ANG=30,D=5,DV=1.5,L=32;
  const RUNX=D/tan(ANG)+DV/tan(ANG)+(L-D/sin(ANG)-DV/sin(ANG));
  let S1=(W-(small?18:36))/(6.3*cos(ANG)+33.5+2);
  const skin=small?12:56;
  if(!small) S1=Math.min(S1,(H*0.30-skin)/(D+3));
  const punc=(small?4:16)+6.3*cos(ANG)*S1;
  return {ANG,D,DV,L,RUNX,S1,skin,punc};
}
function picPlanes(ctx,W,H,c,st,small){
  const g=planesGeom(W,H,small), {ANG,D,DV,RUNX,S1,skin,punc}=g;
  const p=clamp(st.plane??14,4,33.5);
  const wallT=skin+D*S1, wallB=wallT+3*S1;
  const ex=punc+D/tan(ANG)*S1, ix=ex+DV/tan(ANG)*S1, tip=punc+RUNX*S1, ride=wallT+DV*S1;
  ctx.drawImage(fieldImg(W,H),0,0);
  ctx.fillStyle=rgba(VF,1); ctx.fillRect(0,wallT,W,wallB-wallT);
  rl(ctx,0,wallT,W,wallT,LL,small?1.2:1.8,0.85,false);
  rl(ctx,0,wallB,W,wallB,LL,small?1:1.6,0.55,false);
  glowline(ctx,0,skin,W,skin,LL,small?1.4:2.2);
  ctx.save(); ctx.shadowColor=rgba(LL,0.4); ctx.shadowBlur=8;
  rl(ctx,punc,skin,ex,wallT,LL,small?2.4:4.5); ctx.restore();
  rl(ctx,ex,wallT,ix,ride,LL,small?2.4:4.5);
  rl(ctx,ix,ride,tip,ride,LL,small?2.4:4.5);
  cannula(ctx,punc-0.6*S1*cos(ANG),skin-0.6*S1*sin(ANG),ANG,small?6:Math.min(2.05*S1,14),H24);
  ctx.fillStyle=rgba(AC,1); ctx.beginPath(); ctx.arc(tip,ride,small?2.2:3.8,0,7); ctx.fill();
  const stripBot=wallB+(small?4:26);
  const plx=punc+p*S1;
  ctx.save(); ctx.shadowColor=rgba(AC,0.5); ctx.shadowBlur=9;
  rl(ctx,plx,small?2:37,plx,stripBot-4,AC,small?1.6:2.4,0.95,false); ctx.restore();   // starts clear of the LONG AXIS label
  const wx0=small?4:20, wx1=W-(small?4:20), wy0=stripBot+(small?3:16), wy1=H-(small?4:70);
  ctx.fillStyle=rgba(SCRN,1); ctx.strokeStyle=rgba(WFRM,1); ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(wx0,wy0,wx1-wx0,wy1-wy0,small?5:14); ctx.fill(); ctx.stroke();
  const sk2=wy0+(small?7:28), S2=((wy1-(small?5:14))-sk2)/8.5, cx=(wx0+wx1)/2;
  glowline(ctx,wx0+(small?3:10),sk2,wx1-(small?3:10),sk2,LL,small?1.2:1.8);
  const vcy=sk2+6.5*S2, vr=1.5*S2;
  ctx.fillStyle=rgba(VF,1); ctx.beginPath(); ctx.arc(cx,vcy,vr,0,7); ctx.fill();
  ctx.strokeStyle=rgba(LL,0.9); ctx.lineWidth=small?1.2:2; ctx.stroke();
  ctx.fillStyle=rgba(AC,1); ctx.beginPath();
  ctx.moveTo(cx-5,wy0); ctx.lineTo(cx+5,wy0); ctx.lineTo(cx,wy0+7); ctx.closePath(); ctx.fill();
  const inSteel=p<=RUNX;
  const dpt = p<=D/tan(ANG) ? p*tan(ANG) : p<=(D+DV)/tan(ANG) ? D+(p-D/tan(ANG))*tan(ANG) : D+DV;
  if(!small){
    lsText(ctx,"LONG AXIS",Math.max(20,punc+8),26,MONO(10),MU,0.9,"l",1.5);   // right of the hub, which rises to this height
    lsText(ctx,"SKIN",20,skin+17,MONO(10),MU,0.9,"l",1.5);   // left, under the line: the scan line never travels here
    lsText(ctx,"VEIN",20,wallT+15,MONO(10),MU,0.9,"l",1.5);
    htxt(ctx,"TIP",Math.min(tip,W-40)-9,wallB+16,MONO(10),AC,0.95,"right");   // beside the tip, so the scan line over the tip does not run through it
    ctx.fillStyle=rgba(AC,1); ctx.beginPath();
    ctx.moveTo(plx-5,stripBot-2); ctx.lineTo(plx+5,stripBot-2); ctx.lineTo(plx,stripBot+5);
    ctx.closePath(); ctx.fill();
    lsText(ctx,"SHORT AXIS",wx0+14,wy0+18,MONO(10),MU,0.9,"l",1.5);
    lsText(ctx,"SKIN",wx1-22,sk2-11,MONO(9),MU,0.85,"r",1.2);
    const sxx=wx1-14;
    for(let mm=0;mm<=8;mm++){
      const yy=sk2+mm*S2; if(yy>wy1-8)break;
      const maj=mm%5===0;
      rl(ctx,sxx-(maj?9:6),yy,sxx,yy,MU,1.5,maj?0.9:0.5,false);
      if(maj&&mm>0) txt(ctx,String(mm),sxx-13,yy+4,MONO(12),MU,0.9,"right");
    }
  }
  if(inSteel){
    const dy=sk2+dpt*S2;
    ctx.save(); ctx.shadowColor=rgba(LL,0.55); ctx.shadowBlur=9;
    ctx.fillStyle=rgba(LL,1); ctx.beginPath(); ctx.arc(cx,dy,small?2.4:4,0,7); ctx.fill(); ctx.restore();
  } else if(!small){
    lsText(ctx,"NO NEEDLE IN THIS SLICE",cx,sk2+2.6*S2,MONO(11),MU,0.85,"m",1.2);
  }
  if(small) return "";
  hint(ctx,W,H,"DRAG THE PLANE");
  const state=p<RUNX-0.8?"OVER THE SHAFT":(p<=RUNX+0.4?"OVER THE TIP":"PAST THE TIP");
  readout(ctx,H,"WHERE THE PLANE IS",state,"");
  return inSteel
    ? `Scan plane ${p.toFixed(1)} millimetres from the puncture. The short axis screen shows one dot, ${dpt.toFixed(1)} millimetres deep, and it looks the same over shaft and tip.`
    : `Scan plane ${p.toFixed(1)} millimetres from the puncture, past the tip. The needle has left the slice and the screen shows only the vein.`;
}
picPlanes.drag=(c,st,x,y,W,H)=>{
  const g=planesGeom(W,H,false);
  st.plane=clamp((x-g.punc)/g.S1,4,33.5);
};
/* ---- Choosing the length -------------------------------------------------------------------
   The vein is the knob. Upper picture: skin, vein, and the needle's path to the front wall.
   Lower picture, on the same scale and starting under the puncture: that path laid flat twice,
   each time carried on to the shortest catheter one rule allows, and under those the four
   stock lengths. A line drops from the end of each shortest catheter, and a stock catheter
   meets a rule when it reaches that rule's line. */
const CH={DMIN:2,DMAX:12,VB:3,AX:47,HUB:7,PMIN:26,PMAX:34};
function chooseGeom(st,W,H,small){
  const D=clamp(st.depth??5,CH.DMIN,CH.DMAX), ang=clamp(st.angle??45,20,60), path=D/sin(ang);
  if(small) return {D,ang,path,S:1.5,skin:9,x0:12};
  const x0=36+3.05*CH.HUB, DR=CH.DMAX+CH.VB;                 // the label gutter, then the hub
  /* Height, top to bottom: the needle above the skin, the depth range to scale, the two
     shortest catheters, four stock rows, the ruler, the readout. One scale serves both
     pictures, so the path is the same length slanted above and laid flat below. */
  const FIX=202;
  const S=Math.min((W-x0-16)/CH.AX,(H-FIX-4*CH.PMIN)/DR,SMAX);
  const p=clamp((H-FIX-DR*S)/4,CH.PMIN,CH.PMAX);
  const spare=Math.max(0,H-FIX-DR*S-4*p);
  const skin=34+0.3*spare, top2=skin+DR*S+14+0.3*spare;
  const y27=top2+17, y65=y27+27, y0=y65+Math.max(21,0.8*p), ay=y0+3*p+Math.max(15,0.55*p);
  return {D,ang,path,S,p,skin,x0,vt:skin+D*S,ex:x0+D/tan(ang)*S,y27,y65,y0,ay,
          axmax:clamp(Math.floor((W-16-x0)/S),CH.AX,60)};
}
/* a minimum printed to one decimal must not read as a stock length it does not equal */
function minTxt(v){
  for(let dp=1;dp<4;dp++){ const s=v.toFixed(dp);
    if(!G.LEN.some(L=>Number(s)===L&&Math.abs(v-L)>1e-9)) return s; }
  return v.toFixed(4);
}
const lsW=(ctx,s,font,ls)=>{ ctx.font=font; let w=0; for(const ch of s) w+=ctx.measureText(ch).width+ls; return w-ls; };
function verdict(ctx,x,y,ok){
  const col=ok?OKC:NOC;
  ctx.fillStyle=rgba(F0,1); ctx.beginPath(); ctx.arc(x,y,6.2,0,7); ctx.fill();
  ctx.strokeStyle=rgba(col,1); ctx.lineWidth=1.5; ctx.stroke();
  ctx.lineWidth=1.8; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.beginPath();
  if(ok){ ctx.moveTo(x-2.9,y+0.2); ctx.lineTo(x-0.9,y+2.3); ctx.lineTo(x+3,y-2.2); }
  else{ ctx.moveTo(x-2.3,y-2.3); ctx.lineTo(x+2.3,y+2.3); ctx.moveTo(x+2.3,y-2.3); ctx.lineTo(x-2.3,y+2.3); }
  ctx.stroke(); ctx.lineJoin='miter';
}
function picChoose(ctx,W,H,c,st,small){
  const g=chooseGeom(st,W,H,small), {D,ang,path,S,skin,x0}=g;
  const n65=path/0.35, n275=path+27.5;
  const ok65=L=>0.35*L>=path-1e-9, ok275=L=>L-path>=27.5-1e-9;
  ctx.drawImage(fieldImg(W,H),0,0);
  if(small){
    const vt=skin+D*S, ex=x0+D/tan(ang)*S;
    ctx.fillStyle=rgba(VF,1); ctx.fillRect(0,vt,W,CH.VB*S);
    rl(ctx,0,vt,W,vt,LL,1.2,0.85,false);
    glowline(ctx,0,skin,W,skin,LL,1.4);
    rl(ctx,x0,skin,ex,vt,AC,2.4);
    G.LEN.forEach((L,i)=>{ const y=31+i*6.4; rl(ctx,x0,y,x0+L*S,y,LL,2.2,0.9,false); });
    const xa=Math.min(W-4,x0+n65*S); rl(ctx,xa,27,xa,54,AC,1.3,0.9,false);
    return "";
  }
  const {p,vt,ex,y27,y65,y0,ay,axmax}=g, xr=W-76, sx=W-28;
  /* the upper picture */
  ctx.fillStyle=rgba(VF,1); ctx.fillRect(0,vt,xr,CH.VB*S);
  rl(ctx,0,vt,xr,vt,LL,1.8,0.85,false);
  rl(ctx,0,vt+CH.VB*S,xr,vt+CH.VB*S,LL,1.6,0.55,false);
  glowline(ctx,0,skin,W,skin,LL,2.2);
  lsText(ctx,"SKIN",W-16,skin-12,MONO(10),MU,0.9,"r",1.5);
  lsText(ctx,"VEIN",20,vt+Math.min(15,1.5*S+4.5),MONO(10),MU,0.9,"l",1.5);
  rl(ctx,sx,skin,sx,skin+(CH.DMAX+1)*S,MU,1,0.45,false);          // the depth scale
  for(let mm=0;mm<=CH.DMAX+1;mm++){
    const y=skin+mm*S, maj=mm%5===0;
    rl(ctx,sx,y,sx+(maj?10:6),y,MU,1.5,maj?0.9:0.5,false);
    if(maj&&mm>0&&!(y-vt>-19.5&&y-vt<22.5)) txt(ctx,String(mm),sx-7,y+3.5,MONO(12),MU,0.9,"right");   // clear of the handle, whose own number takes its place
  }
  ctx.save(); ctx.setLineDash([2,5]); rl(ctx,x0,skin+8,x0,y27-24,MU,1.2,0.5,false); ctx.restore();   // the puncture, carried down to where the lower picture starts
  const ux=cos(ang), uy=sin(ang);
  rl(ctx,x0-26*ux,skin-26*uy,x0,skin,LL,4.5,0.9);                 // the needle above the skin
  arcp(ctx,x0,skin,17,180,180+ang,MU,1.6,0.8);
  txt(ctx,Math.round(ang)+"°",x0+9,skin-10,MONO(14),AC);
  ctx.save(); ctx.shadowColor=rgba(AC,0.5); ctx.shadowBlur=10; rl(ctx,x0,skin,ex,vt,AC,5); ctx.restore();   // its path to the front wall
  const nx=cos(ang+90), ny=sin(ang+90);
  for(const [bx,by] of [[x0,skin],[ex,vt]]) rl(ctx,bx-nx*5,by-ny*5,bx+nx*5,by+ny*5,AC,2.4);
  ctx.fillStyle=rgba(AC,1); ctx.beginPath(); ctx.roundRect(sx-9,vt-16,18,32,9); ctx.fill();   // the handle rides the scale at the front wall
  ctx.fillStyle=rgba(F0,1);
  ctx.beginPath(); ctx.moveTo(sx-4,vt-5); ctx.lineTo(sx+4,vt-5); ctx.lineTo(sx,vt-10); ctx.fill();
  ctx.beginPath(); ctx.moveTo(sx-4,vt+5); ctx.lineTo(sx+4,vt+5); ctx.lineTo(sx,vt+10); ctx.fill();
  txt(ctx,D.toFixed(1),sx-15,vt+4,MONO(12),AC,1,"right");
  /* the lower picture */
  const X=mm=>x0+mm*S, xmax=X(axmax), xw=X(path);
  const need=(y,n)=>{                                    // the shortest catheter one rule allows, built from the path
    const off=n>axmax, x1=off?xmax:X(n);
    rl(ctx,xw,y,x1,y,LL,2.6,0.8,false);
    ctx.save(); ctx.shadowColor=rgba(AC,0.45); ctx.shadowBlur=8; rl(ctx,x0,y,xw,y,AC,5,1,false); ctx.restore();
    rl(ctx,x0,y-7,x0,y+7,AC,2,1,false);
    if(off){ ctx.fillStyle=rgba(LL,0.85); ctx.beginPath(); ctx.moveTo(x1+7,y); ctx.lineTo(x1-1,y-6); ctx.lineTo(x1-1,y+6); ctx.fill(); }   // longer than the ruler
    else rl(ctx,x1,y-7,x1,y+7,LL,2,0.9,false);
    return {x:x1,off};
  };
  const B=need(y27,n275), A=need(y65,n65), xb=B.x, xa=A.x;
  const lab=(y,names,val,room)=>{                        // the rule, then what it needs: the shorter wording where a line would cross
    const v=val+" mm"; let nm=names[0];
    for(const n of names){ nm=n; if(lsW(ctx,n,MONO(10),1.2)+9+lsW(ctx,v,MONO(12),0.3)<=room) break; }
    lsText(ctx,nm,x0,y,MONO(10),MU,0.92,"l",1.2);
    lsText(ctx,v,x0+lsW(ctx,nm,MONO(10),1.2)+9,y,MONO(12),LL,1,"l",0.3);
  };
  lab(y27-11,["27.5 mm RULE NEEDS","27.5 mm NEEDS"],minTxt(n275),W-12-x0);
  lab(y65-11,["65% RULE NEEDS","65% NEEDS"],minTxt(n65),xb-x0-9);
  if(!B.off){ ctx.save(); ctx.setLineDash([5,4]); rl(ctx,xb,y27+7,xb,ay,LL,1.3,0.62,false); ctx.restore(); }
  if(!A.off) rl(ctx,xa,y65+7,xa,ay,LL,1.3,0.62,false);
  /* a tick or a cross where each line meets each stock row; where the two lines run close,
     the pair stands side by side in the lines' own order */
  let bxa=xa, bxb=xb;
  if(Math.abs(xa-xb)<14.5){ const m=(xa+xb)/2; if(xa<xb){ bxa=m-7.3; bxb=m+7.3; } else { bxb=m-7.3; bxa=m+7.3; } }
  const over=Math.max(bxa,bxb)+6.2-(W-9); if(over>0){ bxa-=over; bxb-=over; }
  G.DEV.forEach((d,i)=>{
    const y=y0+i*p;
    txt(ctx,String(d.L),30,y+4,MONO(12),LL,0.95,"right");
    cannula(ctx,x0,y,0,CH.HUB,d.g==="24G"?H24:H22,0.85);
    rl(ctx,x0,y,X(d.L),y,LL,4.5,0.92,false);
    verdict(ctx,bxb,y,ok275(d.L));
    verdict(ctx,bxa,y,ok65(d.L));
  });
  const amax=5*Math.floor(axmax/5);
  rl(ctx,x0,ay,X(amax),ay,MU,1.4,0.6,false);
  for(let mm=0;mm<=amax;mm+=5){
    const xx=X(mm), maj=mm%10===0;
    rl(ctx,xx,ay,xx,ay+(maj?8:5),MU,1.4,maj?0.85:0.5,false);
    if(maj&&mm) txt(ctx,String(mm),xx,ay+21,MONO(10),MU,0.85,"center");
  }
  lsText(ctx,"mm",x0-9,ay+21,MONO(10),MU,0.8,"r",1.0);
  hint(ctx,W,H,"DRAG THE VEIN");
  readout(ctx,H,"NEEDLE PATH TO THE VEIN",path.toFixed(1),"mm");
  const met=f=>{ const a=G.LEN.filter(f); return a.length?a.join(", "):"none of the four"; };
  return `Vein ${D.toFixed(1)} millimetres deep, needle at ${Math.round(ang)} degrees: the path to the front wall is ${path.toFixed(1)} millimetres. `+
    `The 65% rule needs at least ${minTxt(n65)} millimetres of catheter, met by ${met(ok65)}. `+
    `The 27.5 millimetre minimum needs at least ${minTxt(n275)} millimetres, met by ${met(ok275)}.`;
}
let chGrab="v";                                          // what the finger came down on: the vein, the path's end, or a line
picChoose.drag=(c,st,x,y,W,H,first)=>{
  const g=chooseGeom(st,W,H,false), mm=(x-g.x0)/g.S;
  if(first!==false){
    /* Upper picture: the finger holds the vein's front wall. Lower picture: it holds whichever
       it came down nearest, the end of the path or one of the two lines, until it lifts. */
    if(y<=g.y27-20) chGrab="v";
    else chGrab=[["p",g.path],["a",g.path/0.35],["b",g.path+27.5]].filter(k=>k[1]<=g.axmax)
      .reduce((m,k)=>Math.abs(k[1]-mm)<Math.abs(m[1]-mm)?k:m)[0];
  }
  const d = chGrab==="v" ? (y-g.skin)/g.S : (chGrab==="a"?0.35*mm:chGrab==="b"?mm-27.5:mm)*sin(g.ang);
  st.depth=clamp(Math.round(d*10)/10,CH.DMIN,CH.DMAX);
};

CARDS.forEach(c=>{ c.slug=c.title.toLowerCase().replace(/%/g,' percent').replace(/[^a-z0-9]+/g,'-')
  .replace(/^-+|-+$/g,'').replace(/^the-/,''); });
/* which of the three layouts the stylesheet chose, read back from the page itself */
const tier=()=>{ const mw=parseFloat(getComputedStyle(app).maxWidth)||620; return mw>1000?2:mw>700?1:0; };
/* Size a card's drawing. Phone: exactly as before. Wider: drawn at no more than the widest
   width the renderers are tested at (588) and scaled up, labels with it, never taller than
   the screen leaves room for with the controls in view. */
function fit(cv,kh,khp){
  const win=cv.parentNode, fig=win.parentNode;
  if(tier()===0){ cv._z=1; win.style.maxWidth=''; cv.style.height='min('+khp+'px,max(380px,58vh))'; return; }
  const colW=Math.max(1,fig.getBoundingClientRect().width), vh=window.innerHeight||0;
  let z=Math.max(1,colW/588);
  const extra=Math.max(0,fig.getBoundingClientRect().height-cv.getBoundingClientRect().height);
  if(vh){ const cap=vh-extra-60; if(kh*z>cap) z=Math.max(1,cap/kh); }
  cv._z=z; win.style.maxWidth=Math.round(Math.min(colW,588*z))+'px';
  cv.style.height=Math.round(kh*z)+'px';
}
CARDS.forEach(c=>{ state[c.id]={}; (c.ctrl||[]).forEach(k=>{
  const v=k.opts[0][0]; state[c.id][k.key]= k.key==="len" ? c.ctrl.find(x=>x.key==="len").opts.findIndex(o=>o[0]===v)===-1?0:k.opts.map(o=>o[0]).indexOf(v) : v; });
  (c.ctrl||[]).forEach(k=>{ if(k.key==="len") state[c.id].len=k.opts.map(o=>o[0]).indexOf(k.opts[0][0]); });
  (c.ctrl||[]).forEach(k=>{ if(k.def!==undefined&&k.key!=="len") state[c.id][k.key]=k.def; });
  if(c.numeral===undefined) c.numeral=NUMS[c.id]||null;
});

function paint(cv,card,st,small){
 try{
  const r=cv.getBoundingClientRect();
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const cw=r.width||92, ch=r.height||56;
  const z=small?Math.max(1,cw/92):(cv._z||1);            // thumbnails are drawn at 92 x 56 and scaled
  const W=Math.max(1,Math.round(cw/z)), H=Math.max(1,Math.round(ch/z));
  const bw=z===1?W*dpr:Math.round(cw*dpr), bh=z===1?H*dpr:Math.round(ch*dpr);
  if(cv.width!==bw||cv.height!==bh){ cv.width=bw; cv.height=bh; }
  const ctx=cv.getContext('2d'); if(!ctx) return "";
  ctx.setTransform(dpr*z,0,0,dpr*z,0,0); ctx.clearRect(0,0,W,H);
  HINTX=null;
  return PICS[card.pic](ctx,W,H,card,st,small)||"";
 }catch(err){ repErr((card&&card.id||'?')+': '+(err&&err.message||err)); return ""; }
}

/* v23: the film, a file beside the page, loaded only when asked for */
let filmEl=null, filmFrom=null;
const filmKey=e=>{ if(e.key==='Escape') closeFilm(); };
function openFilm(f,from){
  if(!filmEl){
    filmEl=el('div','film'); filmEl.hidden=true; filmEl.setAttribute('role','dialog');
    filmEl.setAttribute('aria-modal','true'); filmEl.setAttribute('aria-label',f.title);
    const bar=el('div','filmbar'); bar.appendChild(el('span','',f.title+' · '+f.secs+' s'));
    const x=el('button','filmx'); x.type='button'; x.setAttribute('aria-label','Close the film');
    x.innerHTML='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>';
    x.addEventListener('click',closeFilm); bar.appendChild(x);
    const v=document.createElement('video'); v.setAttribute('playsinline',''); v.setAttribute('controls','');
    v.setAttribute('preload','none'); v.width=f.w; v.height=f.h;
    const nt=el('p','filmnote','');
    v.addEventListener('waiting',()=>{ nt.textContent='Loading'; });
    v.addEventListener('playing',()=>{ nt.textContent=''; });
    v.addEventListener('error',()=>{ if(!filmEl.hidden) nt.textContent=(v.error&&v.error.code===4)?
      'This browser cannot play the film.':'The film did not load. Check the connection and try again.'; });
    const box=el('div','filmbox'); box.appendChild(bar); box.appendChild(v); box.appendChild(nt);
    filmEl.appendChild(box);
    filmEl.addEventListener('click',e=>{ if(e.target===filmEl) closeFilm(); });   // a tap outside the film closes it
    document.body.appendChild(filmEl);
  }
  filmFrom=from||null; const fv=filmEl.querySelector('video'); filmEl.querySelector('.filmnote').textContent='';
  fv.src=f.src; filmEl.hidden=false; document.addEventListener('keydown',filmKey);
  const pr=fv.play(); if(pr&&pr.catch) pr.catch(()=>{});
  filmEl.querySelector('.filmx').focus();
}
function closeFilm(){
  if(!filmEl||filmEl.hidden) return;
  const fv=filmEl.querySelector('video'); fv.pause(); fv.removeAttribute('src'); fv.load();   // stop the download too
  filmEl.hidden=true; document.removeEventListener('keydown',filmKey); filmEl.querySelector('.filmnote').textContent='';
  if(filmFrom&&document.body.contains(filmFrom)) filmFrom.focus();
}
/* v27: the tilt check. A phone knows how steeply it is being held. On the card about judging
   the angle the reader holds the handset at what they believe is the angle, taps, and the card
   draws the angle that was held. The reading is used once, on the device, and is not kept. */
const tiltCapable=()=>typeof window.DeviceOrientationEvent!=='undefined'&&!!window.matchMedia&&
  window.matchMedia('(any-pointer:coarse)').matches;
/* the long edge of the handset against the horizontal, from beta, the front-to-back tilt:
   a roll about the long edge does not change it */
const elevation=b=>{ const a=Math.abs(b); return a<=90?a:180-a; };
const TILT_FIG='<svg viewBox="0 -18 200 122"aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round">'+
  '<path d="M12 92H188" stroke-width="2"/>'+
  '<path d="M44 92L152 16" stroke-width="1.6" stroke-dasharray="3 6" opacity=".7"/>'+
  '<g transform="translate(44 92) rotate(-35.1)"><rect x="30" y="-45" width="88" height="42" rx="7" stroke-width="2"/>'+
  '<path d="M108 -31V-17" stroke-width="2" opacity=".6"/></g>'+
  '<path d="M78 92A34 34 0 0 0 71.8 72.4" stroke-width="1.6" opacity=".8"/>'+
  '<text x="86" y="84" fill="currentColor" stroke="none" font-size="15" font-family="\'GM\',monospace">?</text></svg>';
let tiltOff=null;
function tiltUI(c,st,fig,win,redraw,syncChips){
  const aim=c.tilt.aim, DENIED='No tilt reading was allowed here. If the phone did not ask, open the page from its web address and try again.';
  const btn=el('button','tiltbtn'); btn.type='button';
  btn.innerHTML='<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.1" y="1.3" width="5.8" height="13.4" rx="1.5" transform="rotate(42 8 8)" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>';
  const bl=el('span','',c.tilt.label); btn.appendChild(bl);
  const note=el('p','tiltnote',''); note.setAttribute('role','status');
  fig.appendChild(btn); fig.appendChild(note);
  let buf=[], ov=null, timer=0, listening=false, t0=0;
  const say=s=>{ note.textContent=s; };
  const onOri=e=>{ if(typeof e.beta!=='number'||!isFinite(e.beta)) return;
    buf.push([performance.now(),elevation(e.beta)]); if(buf.length>80) buf.shift(); };
  const stop=()=>{ if(listening){ window.removeEventListener('deviceorientation',onOri); listening=false; }
    clearTimeout(timer); if(ov){ if(ov.parentNode) ov.parentNode.removeChild(ov); ov=null; } };
  const clear=()=>{ if(st.held!==undefined){ delete st.held; say(''); bl.textContent=c.tilt.label; } };
  const lock=()=>{
    const t=t0||performance.now(); t0=0;
    /* the readings from just before the tap: the tap itself jolts the handset */
    let xs=buf.filter(r=>r[0]>=t-520&&r[0]<=t-110).map(r=>r[1]);
    if(!xs.length) xs=buf.slice(-3).map(r=>r[1]);
    if(!xs.length) return;                               // nothing has arrived yet; the timer will say so
    xs.sort((a,b)=>a-b); const held=xs[xs.length>>1];
    stop();
    st.held=held; st.angle=clamp(held,20,60);
    redraw(); syncChips();
    const r=Math.round(held), d=r-aim;
    let s='You held '+r+'°: ';
    s+= d===0 ? 'the '+aim+'° you aimed for.' :
        Math.abs(d)<=2 ? 'within 2° of the '+aim+'° you aimed for.' :
        Math.abs(d)+'° '+(d<0?'flatter':'steeper')+' than the '+aim+'° you aimed for.';
    if(held<20) s+=' The picture stops at 20°.'; else if(held>60) s+=' The picture stops at 60°.';
    say(s); bl.textContent='Try again'; live.textContent=s; btn.focus();
  };
  const arm=()=>{
    buf=[]; if(!listening){ window.addEventListener('deviceorientation',onOri); listening=true; }
    ov=el('div','tiltov'); ov.setAttribute('role','group'); ov.setAttribute('aria-label','Tilt check');
    ov.innerHTML=TILT_FIG;
    const p1=el('p','','Hold the phone as if its long edge were the needle, at what you believe is '+aim+'° to the table.');
    const go=el('button','go','This is my '+aim+'°'); go.type='button';
    const no=el('button','no','Cancel'); no.type='button';
    ov.appendChild(p1); ov.appendChild(go); ov.appendChild(no); win.appendChild(ov);
    go.addEventListener('pointerdown',()=>{ t0=performance.now(); });
    go.addEventListener('click',lock);
    no.addEventListener('click',()=>{ stop(); btn.focus(); });
    timer=setTimeout(()=>{ if(ov&&!buf.length){
      p1.textContent='No tilt reading has arrived, so the check cannot run on this device or in this view.';
      if(go.parentNode) go.parentNode.removeChild(go); no.textContent='Close'; no.focus(); } },1600);
    go.focus();
  };
  btn.addEventListener('click',()=>{
    stop(); clear(); say(''); redraw(); syncChips();
    const D=window.DeviceOrientationEvent;
    try{
      if(D&&typeof D.requestPermission==='function')
        D.requestPermission().then(r=>{ if(r==='granted') arm(); else say(DENIED); },()=>say(DENIED));
      else arm();
    }catch(e){ say(DENIED); }
  });
  tiltOff=stop;
  return {clear};
}
function entry(i){
  const c=CARDS[i], st=state[c.id];
  if(tiltOff){ tiltOff(); tiltOff=null; }
  delete st.held;
  app.className='ent'; app.innerHTML='';
  const hd=el('div','hd'), cols=el('div','cols'), fig=el('div','fig'), tx=el('div','txt');
  app.appendChild(hd); app.appendChild(cols); cols.appendChild(fig); cols.appendChild(tx);
  const bk=el('button','bk','\u2190 All terms'); bk.type='button';
  bk.addEventListener('click',index); hd.appendChild(bk);
  const eb=el('p','eyebrow',`TERM ${i+1<10?'0':''}${i+1} \u00b7 ${(c.topic||'').toUpperCase()}`);
  eb.style.marginTop='8px'; hd.appendChild(eb);
  hd.appendChild(el('h1','',c.title));
  const kh=c.kh||KH[c.pic]||470, khp=Math.min(kh,KHP[c.pic]||kh);
  const win=el('div','win'); const cvv=document.createElement('canvas');
  cvv.setAttribute('role','img'); cvv.style.height='min('+khp+'px,max(380px,58vh))';
  win.appendChild(cvv); fig.appendChild(win);
  let anim=0, tilt=null;
  const redraw=()=>{ const a=paint(cvv,c,st,false); cvv.setAttribute('aria-label',a); return a; };
  /* drag */
  const dragFn=PICS[c.pic].drag;
  if(dragFn && !(c.ctrl||[]).every(k=>k.key==="len"&&c.pic!=="arc")){
    let on=false, first=false;                           // first: the pointer has just come down
    cvv.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});   // no long-press select or copy
    cvv.addEventListener('pointerdown',e=>{ if(!dragFn)return; document.body.classList.add('dragging');
      on=true; first=true; cvv.setPointerCapture(e.pointerId); move(e); });
    const move=e=>{ if(!on)return;
      const r=cvv.getBoundingClientRect(), z=cvv._z||1;   // the drawing's own units: on wide screens it is drawn smaller and scaled up
      if(tilt) tilt.clear();
      dragFn(c,st,(e.clientX-r.left)/z,(e.clientY-r.top)/z,r.width/z,r.height/z,first); first=false;
      cancelAnimationFrame(anim); redraw(); syncChips(); };
    cvv.addEventListener('pointermove',move);
    const end=()=>{ document.body.classList.remove('dragging'); };
    cvv.addEventListener('pointercancel',()=>{ on=false; end(); });
    cvv.addEventListener('pointerup',()=>{ end(); if(!on)return; on=false;
      live.textContent=cvv.getAttribute('aria-label'); });
    cvv.tabIndex=0;
    cvv.addEventListener('keydown',e=>{
      if(!e.key.startsWith('Arrow')) return; e.preventDefault();
      const mag=e.shiftKey?5:1, up=(e.key==='ArrowRight'||e.key==='ArrowUp');
      if(tilt) tilt.clear();
      if(c.pic==='depth') st.press=clamp((st.press??0)+((e.key==='ArrowDown'||e.key==='ArrowRight')?1:-1)*0.05*mag,0,1);
      else if(c.pic==='stages') st.stage=clamp((st.stage??0)+(up?1:-1)*0.1*mag,0,2);
      else if(c.pic==='planes') st.plane=clamp((st.plane??14)+(up?1:-1)*0.5*mag,4,33.5);
      else if(c.pic==='choose') st.depth=clamp(Math.round(((st.depth??5)+((e.key==='ArrowDown'||e.key==='ArrowRight')?1:-1)*0.1*mag)*10)/10,CH.DMIN,CH.DMAX);
      else st.angle=clamp((st.angle??45)+(up?1:-1)*mag,20,60);
      cancelAnimationFrame(anim); redraw(); syncChips();
      live.textContent=cvv.getAttribute('aria-label');
    });
  }
  const rows=[];
  const syncChips=()=>{ (c.ctrl||[]).forEach((k,ki)=>{
    [...rows[ki].children].forEach((b,j)=>{
      const v=k.opts[j][0];
      const cur= k.key==="len" ? st.len===j :
                 typeof st[k.key]==="number" ? Math.abs(st[k.key]-v)<0.51 : st[k.key]===v;
      b.setAttribute('aria-pressed',cur?'true':'false'); }); }); };
  (c.ctrl||[]).forEach((k,ki)=>{
    const kl=el('p','eyebrow klab',k.k.toUpperCase()); fig.appendChild(kl);
    const row=el('div','krow'); row.setAttribute('role','group'); row.setAttribute('aria-label',k.k);
    k.opts.forEach((o,j)=>{
      const b=el('button','',o[1]); b.type='button';
      b.addEventListener('click',()=>{
        if(tilt) tilt.clear();
        const from={...st};
        if(k.key==="len") st.len=j; else st[k.key]=o[0];
        const to={...st};
        syncChips();
        const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const animatable=["press","angle","stage","plane","depth"].includes(k.key);
        if(reduced||!animatable){ redraw(); }
        else{
          const t0=performance.now(), dur=420, e=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
          const step=now=>{ const u=Math.min(1,(now-t0)/dur);
            st[k.key]=from[k.key]+(to[k.key]-from[k.key])*e(u);
            redraw();
            if(u<1) anim=requestAnimationFrame(step); else st[k.key]=to[k.key]; };
          cancelAnimationFrame(anim); anim=requestAnimationFrame(step);
        }
        live.textContent=k.k+': '+o[1]+'. '+cvv.getAttribute('aria-label');
      });
      row.appendChild(b);
    });
    rows.push(row); fig.appendChild(row);
  });
  syncChips();
  if(c.tilt&&tiltCapable()) tilt=tiltUI(c,st,fig,win,redraw,syncChips);   // v27: on a phone, the card can read the angle the handset is held at
  const one=el('div','oneline'); one.appendChild(el('p','eyebrow','IN ONE LINE'));
  one.appendChild(el('p','',c.tldr)); tx.appendChild(one);
  tx.appendChild(el('p','lede',c.lede));
  c.body.forEach(b=>{ if(b.h) tx.appendChild(el('h2','',b.h));
    else if(b.tab){ const tb=el('div','dtab'); tb.setAttribute('role','table');
      const NUM=/^[\d.]+ ?(mm|%|\u00b0|\u00d7)?$/;
      b.tab.forEach((row,ri)=>{ const tr=el('div',ri?'dtr':'dtr dth'); tr.setAttribute('role','row');
        const a=el('span','dl',row[0]); a.setAttribute('role',ri?'cell':'columnheader');
        const v=el('span',NUM.test(row[1])?'dv2':'dvp',row[1]);
        v.setAttribute('role',ri?'cell':'columnheader');
        tr.appendChild(a); tr.appendChild(v); tb.appendChild(tr); });
      tx.appendChild(tb); }
    else tx.appendChild(el('p','body',b.p)); });
  if(c.film){ const fb=el('button','filmbtn'); fb.type='button';
    fb.innerHTML='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.5l9 5.5-9 5.5z" fill="currentColor"/></svg>';
    fb.appendChild(el('span','',c.film.label)); fb.addEventListener('click',()=>openFilm(c.film,fb));
    tx.appendChild(fb); }   // v23: the film, one tap away
  const s=el('div','src'); s.appendChild(el('p','eyebrow','SOURCES'));
  c.src.forEach(x=>s.appendChild(el('p','',x))); tx.appendChild(s);
  if(c.links){ const lr=el('div','');
    c.links.forEach(([tt,h])=>{ const a=document.createElement('a'); a.className='plink';
      a.href=h; a.target='_blank'; a.rel='noopener'; a.textContent=tt+' \u2192'; lr.appendChild(a); });
    tx.appendChild(lr); }
  const nav=el('div','nav');
  const mk=(j,kind,cls)=>{ const b=el('button',cls); b.type='button';
    b.appendChild(el('span','k',kind));
    b.appendChild(el('span','v', j===null?'All terms':CARDS[j].title));
    b.addEventListener('click',()=> j===null?index():entry(j)); return b; };
  nav.appendChild(mk(i>0?i-1:null,'\u2190 PREVIOUS',''));
  nav.appendChild(mk(i<CARDS.length-1?i+1:null,'NEXT \u2192','r'));
  tx.appendChild(nav);
  fit(cvv,kh,khp);
  refresh=()=>{ fit(cvv,kh,khp); redraw(); };
  requestAnimationFrame(redraw);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>redraw());
  live.textContent=c.title+', term '+(i+1)+' of '+CARDS.length+'. '+c.tldr;
  window.scrollTo(0,0);
}
/* Rotation or a resized window redraws the current screen for its new size. On a phone
   only a change of width counts, so the toolbar sliding away while scrolling does nothing. */
let rzf=0, lastW=window.innerWidth, lastH=window.innerHeight;
window.addEventListener('resize',()=>{
  const w=window.innerWidth, h=window.innerHeight;
  if(w===lastW&&(h===lastH||tier()===0)) return;
  lastW=w; lastH=h; cancelAnimationFrame(rzf);
  rzf=requestAnimationFrame(()=>{ if(refresh) refresh(); });
});
/* A term's own address opens that term. Nothing is remembered: an ordinary visit, or a
   reload, always starts at the list of terms. */
function boot(){
  const h=decodeURIComponent((location.hash||'').slice(1)).toLowerCase();
  const i=h?CARDS.findIndex(c=>c.slug===h):-1;
  if(i>=0){ entry(i); try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
  else index();
}
window.addEventListener('hashchange',boot);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(boot); else boot();
</script>
